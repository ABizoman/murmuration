<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Murmuration</title>
<script src="/vendor/Tone.js"></script><!-- served by server.js from node_modules (falls back to unpkg) -->
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --dim:#8a90a0;
          --drums:#f2a65a; --bass:#6fb3ff; --chords:#9b8cff; --melody:#5fd1a4; --pad:#8fa8ff; --arp:#ff8fd1; --perc:#ffe27a; --ok:#5fd1a4; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 6px 0 0; }
  label { color:var(--dim); display:flex; gap:6px; align-items:center; }
  input, select, button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  input[type=number] { width:56px; }
  button.primary { background:#3a5bff; border-color:#3a5bff; font-weight:600; padding:7px 16px; }
  button:disabled { opacity:.5; }
  #structure { font-weight:600; }
  #net { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; background:var(--dim); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  main { padding:14px 16px; display:grid; gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; }
  .two { display:grid; grid-template-columns: 1fr 200px; gap:12px; }
  @media (max-width: 700px) { .two { grid-template-columns: 1fr; } #qrPanel { display:none; } }
  .agents { display:grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap:10px; }
  .agent { border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:grid; gap:6px; }
  .agent.mine { border-color:#4a5570; background:#1c2130; }
  .agent .name { font-weight:600; display:flex; justify-content:space-between; gap:6px; }
  .agent .who { font-weight:400; font-size:12px; color:var(--dim); }
  .agent .why { font:12px ui-monospace, monospace; color:var(--dim); min-height:1.4em; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  table { width:100%; border-collapse:collapse; font:12px ui-monospace, monospace; }
  td, th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:400; }
  #qr img { width:100%; display:block; }
  #lanUrl { font:12px ui-monospace, monospace; color:var(--dim); word-break:break-all; margin-top:6px; }
  canvas { width:100%; display:block; }
  #log { font:12px/1.5 ui-monospace, monospace; max-height:260px; overflow:auto; color:var(--dim); white-space:pre-wrap; }
  #log b { color:var(--text); }
  #me { font-size:22px; font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>Murmuration</h1>
  <button id="start" class="primary">Start a song</button>
  <button id="record" type="button">Record 60 s</button>
  <label>Song <select id="song"></select></label>
  <label>Seed <input id="seed" value="durhack" size="9" /></label>
  <label>Style <select id="style"><option value="dance">Dance</option><option value="pop">Upbeat pop</option></select></label>
  <label><input type="checkbox" id="endAfterPass" /> End after one pass</label>
  <label><input type="checkbox" id="grow" /> Grow (each device plays only its own part)</label>
  <span id="structure"></span>
  <span id="samples" style="color:var(--dim);font-size:13px"></span>
  <span id="net"></span>
</header>

<main>
  <div class="two">
    <section class="panel">
      <h2>This device</h2>
      <div class="row"><span id="me">…</span><span id="meRoles" style="color:var(--dim)"></span></div>
      <h2 style="margin-top:12px">Agents</h2>
      <div class="agents" id="agents"></div>
    </section>
    <section class="panel" id="qrPanel">
      <h2>Join from a phone</h2>
      <div id="qr"><img src="/qr.svg" alt="QR code to join" onerror="this.parentElement.textContent='Run node server.js to get a QR code.'" /></div>
      <div id="lanUrl"></div>
    </section>
  </div>

  <section class="panel">
    <h2>Now playing (top) · next phrase (bottom) · bright = this device, dim = other devices</h2>
    <canvas id="grid" height="380"></canvas>
  </section>

  <section class="panel">
    <h2>Meters</h2>
    <div id="meters" style="font:12px ui-monospace, monospace; color:var(--dim)"></div>
  </section>

  <section class="panel">
    <h2>Direction (voted by the swarm) and decision help</h2>
    <div id="direction"></div>
  </section>

  <section class="panel">
    <h2>Swarm</h2>
    <table id="peers"></table>
  </section>

  <section class="panel">
    <h2>Log</h2>
    <div id="log"></div>
  </section>

  <section class="panel">
    <h2>Import MIDI pack loops (used by this device's agents)</h2>
    <div class="row">
      <label>Role <select id="mRole"><option>drums</option><option>bass</option><option>chords</option><option>melody</option><option>pad</option><option>arp</option><option>perc</option></select></label>
      <label>Style <input id="mStyle" value="pack" size="7" /></label>
      <label>Density <select id="mDensity"><option>sparse</option><option selected>medium</option><option>busy</option></select></label>
      <label>File key <select id="mKey"></select></label>
      <label>Mode <select id="mMode"><option>minor</option><option>major</option></select></label>
      <label>Chords per bar <input id="mProg" value="i VI III VII" size="12" /></label>
      <input id="mFile" type="file" accept=".mid,.midi" multiple />
    </div>
  </section>
</main>

<script type="module" src="./src/main.js"></script>
</body>
</html>
