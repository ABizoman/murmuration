<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<title>Murmuration</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231E1B4B' stroke-width='2'%3E%3Ccircle cx='5' cy='12' r='2'/%3E%3Ccircle cx='12' cy='6' r='2'/%3E%3Ccircle cx='19' cy='12' r='2'/%3E%3Ccircle cx='12' cy='18' r='2'/%3E%3C/svg%3E" />
<script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" />
<!--
  Phone-first design for the same app. All behaviour comes from src/main.js, exactly as index.html
  uses it: every element id main.js needs is kept below. src/ui/design.js only adds the orb, the
  grid aura, the status line and the prompt box.
-->
<style>
  :root {
    /* main.js reads these four for the part colours */
    --drums:#EA580C; --bass:#2563EB; --chords:#7C3AED; --melody:#059669;
    --ink:#0F1222; --ink-2:#2A2E3D; --muted:#5B6070; --line:#E4E6EC; --soft:#F6F7FA;
    --accent:#1E1B4B; --focus:#4338CA; --ok:#15803D; --bad:#B91C1C;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:#FFF; }
  body { color:var(--ink); font:15px/1.45 Inter, system-ui, sans-serif; }
  button, input, select { font:inherit; }
  [hidden] { display:none !important; }
  .sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

  /* One column on every screen: built for a phone, centred on a laptop */
  .app { max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
         padding:max(12px, env(safe-area-inset-top)) 16px 0; }

  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 0 8px; }
  h1 { margin:0; display:flex; align-items:center; gap:8px; font:600 18px 'Space Grotesk', Inter, sans-serif; letter-spacing:-.01em; }
  .icon-btn { width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:#FFF; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }

  /* Stage */
  .stage { flex:1 0 auto; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:8px 0 4px; }
  .orb-wrap { width:min(340px, 82vw, 46vh); aspect-ratio:1/1; transition:width .9s var(--ease); }
  #orb { width:100%; height:100%; display:block; }
  /* Only if WebGL is unavailable: a still stand-in so the stage is never an empty square. */
  #orb.no-webgl { border-radius:50%; background:radial-gradient(circle at 38% 32%, #9C6BFE, #4C3BD6 45%, #141A8E 72%, rgba(20,26,142,0) 73%); }
  #statusTitle { margin:4px 0 0; font:500 22px 'Space Grotesk', Inter, sans-serif; }
  #statusSub { margin:0; color:var(--muted); font-size:14px; }
  .song { margin:2px 0 0; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  #structure { color:var(--ink-2); font-weight:500; }
  #seed { height:44px; width:104px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:#FFF; color:var(--ink); font-size:16px; }
  #seed:disabled { background:var(--soft); color:var(--muted); border-color:transparent; width:auto; max-width:120px; }
  #lastInstruction { margin:0; font-size:13px; color:var(--ink-2); max-width:420px; display:grid; gap:2px; }
  #lastInstruction [data-k=summary], #lastInstruction [data-k=note] { color:var(--muted); }
  /* Each half keeps to two lines so the echo can never push the aura under the prompt box. */
  #lastInstruction [data-k=line], #lastInstruction [data-k=note] { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  #lastInstruction [data-k=note]:empty { display:none; }
  #start { margin-top:6px; height:48px; min-width:200px; padding:0 24px; border-radius:999px; border:0; background:var(--accent); color:#FFF; font-weight:600; font-size:16px; cursor:pointer; transition:background .3s; }
  #start:disabled { opacity:.55; cursor:default; }
  body.live #start { margin-top:2px; height:44px; min-width:0; padding:0 20px; background:#FFF; color:var(--ink-2); border:1px solid var(--line); font-weight:500; font-size:14px; }

  /* Grid aura: hidden until the song starts, then it opens under the orb */
  .grid-card { width:100%; max-height:0; opacity:0; transform:translateY(16px); overflow:hidden;
               transition:max-height 1s var(--ease), opacity .8s .15s ease, transform 1s var(--ease); }
  #gridCaption { margin:0 0 6px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  #stageGrid { width:100%; height:min(200px, 23vh); display:block; }
  body.live .orb-wrap { width:min(200px, 52vw, 25vh); }
  body.live .song { display:none; }
  body.live .grid-card { max-height:260px; opacity:1; transform:none; }
  /* Small phones: a smaller orb and a one-line note keep the four lanes on screen. */
  @media (max-height: 740px) {
    body.live .orb-wrap { width:min(150px, 40vw, 22vh); }
    #lastInstruction [data-k=note] { -webkit-line-clamp:1; }
    #statusTitle { font-size:20px; }
  }

  /* Prompt box, always within thumb reach */
  .composer-wrap { position:sticky; bottom:0; z-index:4; margin:0 -16px; padding:14px 16px max(12px, env(safe-area-inset-bottom));
                   background:linear-gradient(rgba(255,255,255,0), #FFF 24%); }
  #suggestions { display:flex; gap:8px; overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:none; margin:0 -16px; padding:2px 16px 10px; }
  #suggestions::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; height:44px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:#FFF; font-size:14px; color:var(--ink-2); cursor:pointer; }
  .chip:active { background:var(--soft); }
  #composer { display:flex; align-items:center; gap:8px; padding:6px 6px 6px 18px; border:1px solid #DDE0E7; border-radius:28px; background:#FFF; box-shadow:0 8px 30px rgba(15,18,34,.08); }
  #composer:focus-within { border-color:var(--focus); box-shadow:0 0 0 4px rgba(67,56,202,.12), 0 8px 30px rgba(15,18,34,.08); }
  #prompt { flex:1 1 auto; min-width:0; height:44px; border:0; background:transparent; font-size:16px; color:var(--ink); }
  #prompt::placeholder { color:#6B7080; }
  #prompt:focus { outline:none; }
  #send { width:44px; height:44px; flex:0 0 44px; border-radius:50%; border:0; background:var(--accent); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }

  /* Everything from the original screen, folded away below */
  .more { display:grid; gap:10px; padding:8px 0 20px; }
  details { border:1px solid var(--line); border-radius:16px; background:#FFF; }
  details > summary { cursor:pointer; list-style:none; padding:14px 16px; font-weight:600; color:var(--ink-2); display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:48px; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::after { content:'+'; color:var(--muted); font-size:20px; font-weight:400; }
  details[open] > summary::after { content:'–'; }
  .details-body { padding:0 16px 16px; display:grid; gap:16px; }
  /* Grid and flex children default to min-width:auto, so the swarm table would widen the page. */
  .more, .more > *, .details-body, .details-body > *, .details-body section > * { min-width:0; }
  h2 { margin:0 0 8px; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .me-row { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  #me { font:600 18px 'Space Grotesk', Inter, sans-serif; }
  #meRoles { color:var(--muted); font-weight:400; }
  #net { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--muted); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }

  /* agent cards, written by main.js */
  .agents { display:grid; gap:10px; }
  .agent { border:1px solid var(--line); border-radius:12px; padding:12px; display:grid; gap:10px; background:#FFF; }
  .agent.mine { border-color:#C7C2F2; background:#F7F6FE; }
  .agent .name { font-weight:600; display:flex; justify-content:space-between; gap:6px; }
  .agent .who { font-weight:400; font-size:12px; color:var(--muted); }
  .agent .why { font-size:12px; color:var(--muted); min-height:1.4em; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  label { color:var(--muted); display:flex; gap:6px; align-items:center; min-height:44px; }
  .agent input[type=range] { accent-color:var(--focus); width:110px; height:44px; }
  .agent input[type=checkbox] { accent-color:var(--focus); width:18px; height:18px; }
  select, .more input:not([type]), .more input[type=text] { height:44px; padding:0 8px; border:1px solid var(--line); border-radius:8px; background:#FFF; color:var(--ink); font-size:16px; }
  .more input[type=file] { min-height:44px; }
  #direction .why { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font:12px ui-monospace, monospace; }
  td, th { text-align:left; padding:6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:400; }
  #log { font:12px/1.6 ui-monospace, monospace; max-height:240px; overflow:auto; overflow-wrap:anywhere; color:var(--muted); white-space:pre-wrap; background:var(--soft); border-radius:10px; padding:10px; }
  #log b { color:var(--ink); }
  #grid { display:none; } /* the original grid; main.js still draws to it, the aura replaces it */

  /* Invite */
  dialog { border:0; border-radius:20px; padding:24px; width:min(340px, 92vw); background:var(--ink); color:#E6E8EE; text-align:center; }
  dialog::backdrop { background:rgba(15,18,34,.35); }
  dialog h2 { margin:0 0 12px; font:500 20px 'Space Grotesk', Inter, sans-serif; text-transform:none; letter-spacing:0; color:#E6E8EE; }
  #qr img { width:100%; display:block; }
  #lanUrl { font:12px ui-monospace, monospace; color:#B8BCC8; margin-top:10px; word-break:break-all; }
  #inviteClose { margin-top:16px; height:44px; padding:0 20px; border-radius:999px; background:transparent; color:#E6E8EE; border:1px solid #3A3F52; cursor:pointer; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6.6 10.6 10.4 7.4M13.6 7.4l3.8 3.2M17.4 13.4l-3.8 3.2M10.4 16.6 6.6 13.4"/></svg>
      Murmuration
    </h1>
    <button id="inviteBtn" class="icon-btn" type="button" aria-label="Invite a device">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A2E3D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 17v4"/></svg>
    </button>
  </header>

  <main class="stage" aria-label="Now playing">
    <div class="orb-wrap"><canvas id="orb" role="img" aria-label="Orb that moves with the music this device is playing"></canvas></div>
    <p id="statusTitle" aria-live="polite">Ready when you are</p>
    <p id="statusSub"></p>
    <p class="song"><span id="structure"></span><label class="sr" for="seed">Seed</label><input id="seed" value="durhack" size="9" aria-label="Seed" /></p>
    <p id="lastInstruction" hidden><span data-k="line"><span data-k="text"></span> <span data-k="summary"></span></span><span data-k="note"></span></p>
    <button id="start" type="button">Start a song</button>

    <div class="grid-card">
      <p id="gridCaption"></p>
      <canvas id="stageGrid" role="img" aria-label="The music around now: notes slide right to left through the line in the middle"></canvas>
    </div>
  </main>

  <div class="composer-wrap">
    <div id="suggestions">
      <button class="chip" type="button" data-say="Busier">Busier</button>
      <button class="chip" type="button" data-say="Calm it down">Calm it down</button>
      <button class="chip" type="button" data-say="Go higher">Go higher</button>
      <button class="chip" type="button" data-say="Take a break">Take a break</button>
      <button class="chip" type="button" data-say="Let it decide">Let it decide</button>
    </div>
    <form id="composer" autocomplete="off">
      <label for="prompt" class="sr">Tell your agent what to play</label>
      <input id="prompt" type="text" enterkeyhint="send" placeholder="Tell your agent what to play" />
      <button id="send" type="submit" aria-label="Send to your agent">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </div>

  <div class="more">
    <details>
      <summary><span class="me-row">Your agents <span id="me">…</span><span id="meRoles"></span></span></summary>
      <div class="details-body"><div class="agents" id="agents"></div></div>
    </details>

    <details>
      <summary>Under the hood</summary>
      <div class="details-body">
        <div id="net"></div>
        <section><h2>Direction (voted by the swarm)</h2><div id="direction"></div></section>
        <section><h2>Swarm</h2><div style="overflow-x:auto"><table id="peers"></table></div></section>
        <section><h2>Log</h2><div id="log"></div></section>
        <section>
          <h2>Import MIDI pack loops</h2>
          <div class="row">
            <label>Role <select id="mRole"><option>drums</option><option>bass</option><option>chords</option><option>melody</option></select></label>
            <label>Style <input id="mStyle" value="pack" size="7" /></label>
            <label>Density <select id="mDensity"><option>sparse</option><option selected>medium</option><option>busy</option></select></label>
            <label>File key <select id="mKey"></select></label>
            <label>Mode <select id="mMode"><option>minor</option><option>major</option></select></label>
            <label>Chords per bar <input id="mProg" value="i VI III VII" size="12" /></label>
            <input id="mFile" type="file" accept=".mid,.midi" multiple />
          </div>
        </section>
        <canvas id="grid" height="380"></canvas>
      </div>
    </details>
  </div>
</div>

<dialog id="invite" aria-labelledby="inviteTitle">
  <h2 id="inviteTitle">Join from a phone</h2>
  <div id="qr"><img src="/qr.svg" alt="QR code to join" onerror="this.parentElement.textContent='Run node server.js to get a QR code.'" /></div>
  <div id="lanUrl"></div>
  <button id="inviteClose" type="button">Close</button>
</dialog>

<!-- The app itself: the same file index.html runs. Then the design layer. -->
<script type="module" src="./src/main.js"></script>
<script type="module" src="./src/ui/design.js"></script>
</body>
</html>
